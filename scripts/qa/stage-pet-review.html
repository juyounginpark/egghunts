<!doctype html><html lang="ko"><meta charset="utf-8"><title>스테이지 24³ 검수</title><script type="module">
import * as T from '/node_modules/three/build/three.module.js';
import {loadVoxels,voxelModel} from '/src/voxel.ts';import {animatePet,greetPet} from '/src/pet-animation.ts';
const renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setSize(320,320);
const scene=new T.Scene();scene.add(new T.HemisphereLight(0xfffaee,0x92978c,2.5));const sun=new T.DirectionalLight(0xfff4df,2.6);sun.position.set(-3,6,5);scene.add(sun);
const camera=new T.OrthographicCamera(),black=new T.MeshBasicMaterial({color:0x283128}),gray=new T.MeshLambertMaterial({color:0xaaaaaa});
window.reviewStage=async rows=>{
 const canvas=document.createElement('canvas');canvas.width=1152;canvas.height=576;const ctx=canvas.getContext('2d');ctx.fillStyle='#f5efdb';ctx.fillRect(0,0,1152,576);
 const output=[];
 for(let i=0;i<rows.length;i++){
  const row=rows[i];await loadVoxels([row.key]);const model=voxelModel(row.key,true);scene.add(model);const box=new T.Box3().setFromObject(model),center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3()),extent=Math.max(size.x,size.y,size.z)*.72;
  camera.left=-extent;camera.right=extent;camera.top=extent;camera.bottom=-extent;camera.near=.01;camera.far=30;camera.updateProjectionMatrix();
  const mats=[];model.traverse(o=>{if(o.isMesh)mats.push([o,o.material]);});const images=[];
  const sheet=document.createElement('canvas');sheet.width=960;sheet.height=320;const sc=sheet.getContext('2d');sc.fillStyle='#f5efdb';sc.fillRect(0,0,960,320);
  for(let v=0;v<6;v++){
   const a=[row.previewAngle,0,90,180,row.previewAngle,row.previewAngle][v]*Math.PI/180;
   camera.position.set(center.x+Math.sin(a)*4,center.y+(v===0||v>=4?1:.15),center.z+Math.cos(a)*4);camera.lookAt(center);
   mats.forEach(([o,m])=>o.material=v===4?black:v===5?gray:m);renderer.render(scene,camera);images.push(renderer.domElement.toDataURL());sc.drawImage(renderer.domElement,v*160,0,160,160);
   if(v===0){const x=i%6*192,y=Math.floor(i/6)*288;ctx.fillStyle=row.secretDragon?'#eadab3':'#fff9e8';ctx.fillRect(x+4,y+4,184,276);ctx.drawImage(renderer.domElement,x+4,y+4,184,184);ctx.fillStyle='#3e4833';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(row.name,x+96,y+206,178);ctx.font='11px sans-serif';ctx.fillText(row.secretDragon?'SECRET':row.role,x+96,y+223,178);}
   if(v===4)ctx.drawImage(renderer.domElement,i%6*192+74,Math.floor(i/6)*288+228,44,44);
  }
  mats.forEach(([o,m])=>o.material=m);const a=row.previewAngle*Math.PI/180;camera.position.set(center.x+Math.sin(a)*4,center.y+1,center.z+Math.cos(a)*4);camera.lookAt(center);
  const strip=document.createElement('canvas');strip.width=160*24;strip.height=160;const ac=strip.getContext('2d'),poses=[];
  for(let f=0;f<24;f++){animatePet(model,row.id,f*7/24);renderer.render(scene,camera);ac.drawImage(renderer.domElement,f*160,0,160,160);if(f<6)sc.drawImage(renderer.domElement,f*160,160,160,160);poses.push(model.getObjectByName('head').matrixWorld.elements.slice());}
  const greeting=document.createElement('canvas');greeting.width=3840;greeting.height=160;const gc=greeting.getContext('2d');
  for(let f=0;f<24;f++){animatePet(model,row.id,f*2.4/23);greetPet(model,row.id,f*2.4/23);renderer.render(scene,camera);gc.drawImage(renderer.domElement,f*160,0,160,160);}
  output.push({id:row.id,images,sheet:sheet.toDataURL(),strip:strip.toDataURL(),greeting:greeting.toDataURL(),triangles:renderer.info.render.triangles,poses});scene.remove(model);
 }
 return {output,sheet:canvas.toDataURL()};
};
</script></html>
