# Install under /etc/nginx/conf.d/. Certbot adds TLS to this server block.
limit_req_zone $binary_remote_addr zone=game_http:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=game_open:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=game_connections:1m;
map $http_upgrade $game_connection { default upgrade; '' close; }
server {
 listen 80;
 server_name egghunts.54-180-115-11.sslip.io;
 server_tokens off;
 client_max_body_size 12k;
 client_body_timeout 10s;
 client_header_timeout 10s;
 keepalive_timeout 15s;
 access_log off;
 error_log /var/log/nginx/egghunts-error.log warn;
 limit_conn game_connections 12;
 limit_req_status 429;
 location = /game {
  limit_req zone=game_http burst=20 nodelay;
  limit_req zone=game_open burst=30 nodelay;
  proxy_pass http://127.0.0.1:4330;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $game_connection;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Host $host;
  proxy_read_timeout 35s;
  proxy_send_timeout 10s;
  proxy_buffering off;
 }
 location = /healthz { limit_req zone=game_open burst=5 nodelay; proxy_pass http://127.0.0.1:4330; }
 location = /readyz { limit_req zone=game_open burst=5 nodelay; proxy_pass http://127.0.0.1:4330; }
 location / { return 404; }
}
